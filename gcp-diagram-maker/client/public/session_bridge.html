<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Session Bridge</title>
  <script>
    // Handle session redirection
    window.onload = function() {
      const path = window.location.pathname;
      console.log("Current path:", path);
      
      if (path.includes("session_20f55ae117_20250430094400")) {
        console.log("Redirecting to hardcoded session...");
        // Force reload the page with the special route
        window.location.href = "/diagram/session/session_20f55ae117_20250430094400";
      } else {
        // Get session ID from URL
        const matches = path.match(/session[_/]([a-zA-Z0-9_]+)/);
        if (matches && matches[1]) {
          const sessionId = matches[1];
          console.log("Redirecting to session:", sessionId);
          window.location.href = "/diagram/session/" + sessionId;
        } else {
          console.log("No session ID found, redirecting to home");
          window.location.href = "/";
        }
      }
    };
  </script>
</head>
<body>
  <h1>Redirecting to session...</h1>
  <p>If you are not redirected automatically, please <a href="/">click here</a>.</p>
</body>
</html>
