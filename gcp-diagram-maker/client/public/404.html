<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Page Not Found</title>
  <script>
    // Advanced session redirection to avoid 404s
    (function() {
      const path = window.location.pathname;
      console.log("404 handler activated for path:", path);
      
      // If the URL contains a session ID, redirect to the session-redirect.html
      if (path.includes("session_")) {
        console.log("Session ID detected in 404 page, redirecting to handler");
        // Redirect to our dedicated redirect page with the original URL
        window.location.replace("/session-redirect.html?from=" + encodeURIComponent(window.location.pathname));
        return;
      }
      
      // Default redirect to home for non-session URLs
      window.location.replace("/");
    })();
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      text-align: center;
      max-width: 600px;
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      color: #0078d4;
      margin-top: 0;
    }
    .spinner {
      border: 4px solid rgba(0, 120, 212, 0.2);
      border-left-color: #0078d4;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Redirecting...</h1>
    <div class="spinner"></div>
    <p>If you're not redirected automatically, <a href="/">click here to return to dashboard</a>.</p>
  </div>
</body>
</html>
